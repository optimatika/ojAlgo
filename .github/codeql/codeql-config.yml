name: ojAlgo CodeQL config
paths:
  - 'src/main/**'
paths-ignore:
  - '**/src/test/**'
  - '**/test/**'
  - '**/*Test.java'
  - '**/*Tests.java'
  - '**/*IT.java'

# Precision styr falska positiver. Severity styr hur allvarligt något är.
# Filtrera hårt på precision, behåll warnings så korrekthetsfrågorna överlever.
query-filters:
  - exclude:
      precision: medium
  - exclude:
      precision: low
  # Åsikter om struktur och stil, inte buggar
  - exclude:
      tags contain:
        - maintainability
        - readability
        - style
  # Rekommendationer är råd snarare än defekter
  - exclude:
      problem.severity: recommendation
